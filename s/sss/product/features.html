/*

 */
function validateQuantity() {
    var quantity = $('#input-quantity').val() * 1;
    var min = 1;
    var max = 100;
    var price = 15.00;
    if (quantity < min) {
        quantity = min;
    } else if (quantity > max) {
        quantity = max;
    }
    $('#input-quantity').val(quantity);

}


var DiscountDecimal = 0.00;
var DiscountTotal = 0;

    function updatePrice() {
        var symbol = "$";
    var quantity = $('#input-quantity').val() * 1;
    var price = 15.00;


    var subTotal = price * quantity;
    var discount = subTotal * DiscountDecimal;
    discount = (Math.round(discount * Math.pow(10, 2)) / Math.pow(10, 2)).toFixed(2);


    var total = (subTotal - discount).toFixed(2);
      console.log(total + "");
    $('#lbl-total-price').text(symbol+formatMoney(total));
    DiscountTotal = discount;
    if (discount > 0) {
        $('#savings').text('(-'+symbol+ formatMoney(discount) + ')');
    }


}

/*
 * Apply Coupon
 */
function applyCoupon() {

    $.ajax({
            type: "Post",
            url: '/StoreFront/CouponCheck',
            data: JSON.stringify({

                "couponCode": $('#modal-input-coupon').val(),

        .done(function(data) {

            var error = data.error;

            var discount = data.discount * 1;

            var couponCode = data.couponCode;
            if (error) {

                updatePrice();

    /*
 * Price Validation
 */
function ValidatePrice() {
    var quantity = $('#input-quantity').val() * 1;
    var price = 15.00;
    var stock = 1;
    if (isSerialNumbers()) {
    if (stock == 0) {
        Swal.fire(
            'Sorry',
            'This product is currently out of stock.',
            'error'
        );

        return false;
    }
    if (quantity > stock) {

                Swal.fire(
            'Sorry',
            'there is only ' + stock + ' left in stock.',
            'error'
        );
             return false;
        }
    }

    var subTotal = price * quantity;
    var discount = subTotal * DiscountDecimal;
    discount = (Math.round(discount * Math.pow(10, 2)) / Math.pow(10, 2)).toFixed(2);


    var total = subTotal - discount;
    if (total >= .50 || total == 0) {
        return (true);
    }
            Swal.fire(
            'Error',
            'Total Price must be above $0.50 or Free.',
            'error'
        );

    return (false);
}

/*
 * Email Validation
 */
function ValidateEmail() {
    var mail = $('#input-email').val();
    if (/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/.test(mail)) {
        return (true);
    }
                Swal.fire(
            'Error',
            'You have entered an invalid email address!',
            'error'
        );
    return (false);
}
